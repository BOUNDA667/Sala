name: sala
description: "A to do flutter app."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  local_auth: ^2.3.0
  get: ^4.6.6
  provider: ^6.1.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.2
  lottie: ^3.3.1
  path_provider: ^2.1.5
  get_it: ^8.0.3
  http: ^1.2.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  table_calendar: ^3.1.3
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  build_runner_core: ^7.2.8
  flutter_launcher_icons: ^0.14.2
  json_serializable: ^6.8.0
  freezed: ^2.5.7

  flutter_lints: ^5.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/
    - assets/lotties/